# Stratex Quantitative Trading Framework - Mypy Type Checker Configuration
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
explicit_package_bases = True
warn_redundant_casts = False
warn_unused_ignores = False
disable_error_code = attr-defined, assignment, arg-type, union-attr, var-annotated, dict-item, operator, has-type, no-redef

exclude = (?x)(
    ^backup/
    | ^backup_ui/
    | ^data_cache/
    | ^research_phase\d+/
    | ^research/
  )
