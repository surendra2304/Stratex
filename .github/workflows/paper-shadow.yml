name: Stratex Paper Shadow

on:
  push:
    branches: [main]
    paths:
      - "paper_shadow_*.py"
      - "data_client.py"
      - "tests/test_paper_shadow_*.py"
      - ".github/workflows/paper-shadow.yml"
  pull_request:
    branches: [main]
    paths:
      - "paper_shadow_*.py"
      - "data_client.py"
      - "tests/test_paper_shadow_*.py"
      - ".github/workflows/paper-shadow.yml"

jobs:
  verify-paper-shadow:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused runtime and test dependencies
        run: python -m pip install --upgrade numpy pandas pytest pytest-asyncio
      - name: Verify paper shadow processing and durable checkpoints
        run: >-
          python -m pytest -q -p pytest_asyncio.plugin
          tests/test_paper_shadow_scheduler.py
          tests/test_paper_shadow_processor.py
          tests/test_paper_shadow_memora.py
