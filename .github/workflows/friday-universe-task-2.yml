name: FRIDAY Universe Task 2 — Stratex
run-name: "Task 2 — Stratex engineering"
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/friday-universe-task-2.yml
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: friday-universe-task-2-Stratex
  cancel-in-progress: false
jobs:
  engineer:
    name: Code and revise continuation handoff
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      bundle_ready: ${{ steps.package.outputs.bundle_ready }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      bundle_filename: ${{ steps.package.outputs.bundle_filename }}
    steps:
      - name: Checkout repository without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Load canonical runner and task instructions
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/surendra2304/FRIDAY/main/scripts/continuous_engineering_local_runner.py -o "$RUNNER_TEMP/continuous_engineering_local_runner.py"
          curl -fsSL https://raw.githubusercontent.com/surendra2304/FRIDAY/main/ops/continuous-engineering/tasks/task-2.md -o "$RUNNER_TEMP/task-2.md"

      - name: Set up Node for Copilot CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Prepare task branch and restore persistent handoff
        id: prepare
        run: python "${{ runner.temp }}/continuous_engineering_local_runner.py" prepare --task 2 --repo-root "$GITHUB_WORKSPACE" --task-file "${{ runner.temp }}/task-2.md"

      - name: Execute implementation and tests for at least 31 active minutes
        id: code
        if: steps.prepare.outcome == 'success'
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
        run: python "${{ runner.temp }}/continuous_engineering_local_runner.py" run --task 2 --repo-root "$GITHUB_WORKSPACE" --task-file "${{ runner.temp }}/task-2.md"

      - name: Package committed branch and handoff even after coding failure
        id: package
        if: always() && steps.prepare.outcome == 'success'
        run: python "${{ runner.temp }}/continuous_engineering_local_runner.py" package --task 2 --repo-root "$GITHUB_WORKSPACE"

      - name: Upload isolated Git bundle
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.package.outputs.bundle_filename }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish branch and create or update code PR
    needs: engineer
    if: always() && needs.engineer.outputs.bundle_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download isolated Git bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.engineer.outputs.artifact_name }}
          path: ${{ runner.temp }}/friday-task-bundle

      - name: Load publisher from canonical FRIDAY runner
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/surendra2304/FRIDAY/main/scripts/continuous_engineering_local_runner.py -o "$RUNNER_TEMP/continuous_engineering_local_runner.py"

      - name: Publish branch and persist continuation state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/continuous_engineering_local_runner.py" publish --task 2 --bundle "$RUNNER_TEMP/friday-task-bundle/${{ needs.engineer.outputs.bundle_filename }}"
