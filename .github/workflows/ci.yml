name: Stratex CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test and Build Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stratex_test
          POSTGRES_PASSWORD: stratex_test
          POSTGRES_DB: stratex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stratex_test -d stratex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PORT: "8000"
      TRADING_MODE: "TESTNET"
      TESTNET_ENABLED: "True"
      LIVE_TRADING_ENABLED: "False"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Linting Check
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.venv,__pycache__

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short

      - name: Run PostgreSQL OMS ledger integration tests
        env:
          STRATEX_TEST_POSTGRES_URL: postgresql://stratex_test:stratex_test@localhost:5432/stratex_test
        run: |
          pytest -v --tb=short tests/test_order_store_postgres_integration.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Build
        run: |
          docker build -t stratex .
