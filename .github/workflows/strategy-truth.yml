name: Stratex Strategy Runtime Truth

on:
  push:
    branches: [main]
    paths:
      - "dashboard.py"
      - "config.py"
      - "config_strategy.py"
      - "strategy_adx_ema.py"
      - "strategy_adx_ema_mtf.py"
      - "research/validation/**"
      - "tests/test_markets_and_strategies.py"
      - "tests/test_oos_claims_are_not_runtime_priors.py"
      - "tests/test_holdout_validation.py"
      - "tests/test_governance_enforcement.py"
      - ".github/workflows/strategy-truth.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard.py"
      - "config.py"
      - "config_strategy.py"
      - "strategy_adx_ema.py"
      - "strategy_adx_ema_mtf.py"
      - "research/validation/**"
      - "tests/test_markets_and_strategies.py"
      - "tests/test_oos_claims_are_not_runtime_priors.py"
      - "tests/test_holdout_validation.py"
      - "tests/test_governance_enforcement.py"
      - ".github/workflows/strategy-truth.yml"

jobs:
  strategy-runtime-truth:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Stratex dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify API reports governed runtime truth
        run: >-
          python -m pytest -q
          tests/test_markets_and_strategies.py
          -k api_strategies
      # An out-of-sample claim that governance has withdrawn must not reach a live
      # signal. These tests are the gate for that, so they run on every change to
      # a strategy config, a strategy module, or the holdout validator.
      - name: Verify no unpromoted strategy carries an out-of-sample claim
        run: >-
          python -m pytest -q
          tests/test_oos_claims_are_not_runtime_priors.py
          tests/test_holdout_validation.py
          tests/test_governance_enforcement.py
          -p pytest_mock
