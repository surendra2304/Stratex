services:
  - type: web
    name: stratex-fra
    env: docker
    region: frankfurt
    plan: free
    repo: https://github.com/surendra2304/stratex.git
    branch: master
    healthCheckPath: /health
    dockerCommand: python scripts/supervise_services.py
    envVars:
      - key: TRADING_MODE
        value: "FUTURES"
      - key: MAX_OPEN_POSITIONS
        value: "10"
      - key: SQ_TREND_ALIGNMENT
        value: "full"
      - key: PROFIT_HARVEST_PCT
        value: "0.015"
      - key: TRAIL_BREAKEVEN_TRIGGER_R
        value: "0.5"
      - key: TESTNET_ONLY
        value: "TRUE"
      - key: TESTNET_ENABLED
        value: "TRUE"
      - key: PAPER_SAFE_MODE
        value: "FALSE"
      - key: LIVE_TRADING_ENABLED
        value: "False"
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
