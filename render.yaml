services:
  - type: web
    name: stratex
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: TRADING_MODE
        value: "FUTURES"
      - key: TESTNET_ONLY
        value: "TRUE"
      - key: TESTNET_ENABLED
        value: "true"
      - key: PAPER_SAFE_MODE
        value: "FALSE"
      - key: BOT_API_KEY
        value: "stratex_api"
      - key: STRATEX_API_KEY
        value: "stratex_api"
      # Exchange Credentials (prompts user in Render Dashboard)
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      # Live Mesh Interconnects
      - key: FRIDAY_URL
        value: "https://friday-zw59.onrender.com"
      - key: FRIDAY_API_KEY
        value: "friday_api"
      - key: INFERENCE_URL
        value: "https://inference-r1sn.onrender.com"
      - key: INFERENCE_API_KEY
        value: "inference_api"
      - key: MEMORA_URL
        value: "https://memora-cavc.onrender.com"
      - key: MEMORA_API_KEY
        value: "memora_api"
      - key: INTELX_URL
        value: "https://intelx-mygl.onrender.com"
      - key: INTELX_API_KEY
        value: "intelx_api"
      - key: FUTURIS_URL
        value: "https://futuris-th6f.onrender.com"
      - key: FUTURIS_API_KEY
        value: "futuris_api"
      - key: CORTEX_URL
        value: "https://cortex-0m7c.onrender.com"
      - key: CORTEX_API_KEY
        value: "cortex_api"
      - key: FORGE_URL
        value: "https://forge-u98k.onrender.com"
      - key: FORGE_API_KEY
        value: "forge_api"
      - key: SENTINEL_URL
        value: "http://localhost:8003"
      - key: SENTINEL_API_KEY
        value: "sentinel_api"
