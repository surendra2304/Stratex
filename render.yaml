services:
  - type: web
    name: stratex-fra
    env: docker
    region: frankfurt
    plan: free
    repo: https://github.com/surendra2304/stratex.git
    branch: master
    healthCheckPath: /health
    dockerCommand: python scripts/supervise_services.py
    envVars:
      - key: TRADING_MODE
        value: "FUTURES"
      - key: MAX_OPEN_POSITIONS
        value: "10"
      - key: SQ_TREND_ALIGNMENT
        value: "full"
      - key: PROFIT_HARVEST_PCT
        value: "0.015"
      - key: TRAIL_BREAKEVEN_TRIGGER_R
        value: "0.4"
      - key: TESTNET_ONLY
        value: "TRUE"
      - key: TESTNET_ENABLED
        value: "TRUE"
      - key: PAPER_SAFE_MODE
        value: "FALSE"
      - key: LIVE_TRADING_ENABLED
        value: "False"
      - key: INTELX_URL
        value: "https://intelx-3cz1.onrender.com"
      - key: INTELX_API_KEY
        value: "intelx_api"
      - key: FUTURIS_URL
        value: "https://futuris-x4f4.onrender.com"
      - key: FUTURIS_API_KEY
        value: "futuris_api"
      - key: INTELX_INTELLIGENCE_ENABLED
        value: "TRUE"
      - key: FUTURIS_FORECAST_ENABLED
        value: "TRUE"
