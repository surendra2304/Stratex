services:
  - type: web
    name: stratex
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      # Cloud public-market shadow research is enabled by default; set this to
      # false in Render to stop it immediately without changing testnet mode.
      - key: STRATEX_SHADOW_PAPER_ENABLED
        value: "true"
      - key: TRADING_MODE
        value: "FUTURES"
      - key: TESTNET_ONLY
        value: "TRUE"
      - key: TESTNET_ENABLED
        value: "true"
      - key: PAPER_SAFE_MODE
        value: "FALSE"
      - key: BOT_API_KEY
        sync: false
      - key: STRATEX_API_KEY
        sync: false
      - key: TRADING_BOT_API_KEY_READ
        sync: false
      - key: TRADING_BOT_API_KEY_CONTROL
        sync: false
      # Exchange Credentials (prompts user in Render Dashboard)
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      # Live Mesh Interconnects
      - key: FRIDAY_URL
        value: "https://friday-zw59.onrender.com"
      - key: FRIDAY_API_KEY
        sync: false
      - key: INFERENCE_URL
        value: "https://inference-h7bn.onrender.com"
      - key: INFERENCE_API_KEY
        sync: false
      - key: MEMORA_URL
        value: "https://memora-cavc.onrender.com"
      - key: MEMORA_API_KEY
        sync: false
      - key: INTELX_URL
        value: "https://intelx-mygl.onrender.com"
      - key: INTELX_API_KEY
        sync: false
      - key: FUTURIS_URL
        value: "https://futuris-th6f.onrender.com"
      - key: FUTURIS_API_KEY
        sync: false
      - key: CORTEX_URL
        value: "https://cortex-0m7c.onrender.com"
      - key: CORTEX_API_KEY
        sync: false
      - key: FORGE_URL
        value: "https://forge-e9kl.onrender.com"
      - key: FORGE_API_KEY
        sync: false
      - key: SENTINEL_URL
        value: "https://sentinel-a861.onrender.com"
      - key: SENTINEL_API_KEY
        sync: false
